services:
  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: analytics
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  python:
    build: .
    container_name: python_env
    ports:
      - "8888:8888"
    volumes:
      - .:/app
    depends_on:
      - db

volumes:
  pgdata: